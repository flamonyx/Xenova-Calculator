<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Xenova Calculator</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xenova">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --ember:#FF6B1A;
  --ember-hi:#FF8F45;
  --flare:#FFBE73;
  --ash:#A79D94;
  --dim:#625A53;
  --white:#FFF6EE;
  --stroke:rgba(255,128,52,.24);
  --glass:rgba(255,107,26,.055);
  --sans:'Sora',system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans Thai','Noto Sans Devanagari','PingFang SC','Hiragino Sans','Apple SD Gothic Neo',sans-serif;
  --display:'Unbounded','Sora',system-ui,-apple-system,'PingFang SC','Hiragino Sans','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--black)}
html,body{margin:0;min-height:100%}
body{background:var(--black);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
img{max-width:100%;display:block;-webkit-user-drag:none}

/* ---------- atmosphere ---------- */
#embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.horizon{position:fixed;left:-30%;right:-30%;bottom:-62vh;height:90vh;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,107,26,.0) 78%,rgba(255,107,26,.22) 92%,rgba(255,160,90,.55) 98.6%,rgba(255,107,26,0) 100%);
  filter:blur(1px)}
.horizon::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,107,26,.16),transparent 70%)}

/* ---------- language ---------- */
#langBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:30;display:flex;align-items:center;gap:7px;
  padding:7px 12px 7px 9px;border-radius:999px;background:rgba(20,10,4,.6);border:1px solid var(--stroke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:600;letter-spacing:.02em}
#langBtn .flag{font-size:18px;line-height:1}
#langBtn svg{width:10px;height:10px;opacity:.7}
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;background:linear-gradient(180deg,#1a0c04,#090401);border:1px solid var(--stroke);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet .grip{width:42px;height:4px;border-radius:4px;background:var(--dim);margin:4px auto 14px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-grid button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--glass);border:1px solid transparent;font-size:14px;text-align:left}
.lang-grid button .flag{font-size:22px}
.lang-grid button[aria-pressed="true"]{border-color:var(--ember);background:rgba(255,107,26,.14)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;
  transition:opacity .7s ease,transform .9s cubic-bezier(.6,0,.2,1)}
body.entered #splash{opacity:0;transform:scale(1.25);pointer-events:none}
.stage{position:relative;width:min(76vw,340px);aspect-ratio:1.5;perspective:900px;display:grid;place-items:center}
.ring{position:absolute;left:-10%;right:-10%;top:18%;bottom:18%;border-radius:50%;border:1px solid rgba(255,128,52,.28);transform-style:preserve-3d}
.ring::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--flare);box-shadow:0 0 14px 4px rgba(255,140,60,.8)}
.ring.r1{animation:orbitA 7s linear infinite}
.ring.r2{left:-22%;right:-22%;top:8%;bottom:8%;border-color:rgba(255,128,52,.14);animation:orbitB 11s linear infinite}
.ring.r2::before{width:5px;height:5px;margin-left:-2.5px;top:-3px;opacity:.8}
@keyframes orbitA{from{transform:rotateX(74deg) rotateZ(0)}to{transform:rotateX(74deg) rotateZ(360deg)}}
@keyframes orbitB{from{transform:rotateX(68deg) rotateY(-10deg) rotateZ(360deg)}to{transform:rotateX(68deg) rotateY(-10deg) rotateZ(0)}}
.logo3d{position:relative;width:100%;transform-style:preserve-3d;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(255,90,10,.35))}
.logo3d img{width:100%}
.logo3d .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%) no-repeat;background-size:260% 100%;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:shine 4.5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes float{0%,100%{transform:translateY(0) rotateY(-7deg) rotateX(4deg)}50%{transform:translateY(-10px) rotateY(7deg) rotateX(-2deg)}}
@keyframes shine{0%,35%{background-position:130% 0}75%,100%{background-position:-40% 0}}
.club{text-align:center;margin-top:-6px}
.club-top{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:14px;color:var(--ash);letter-spacing:.02em}
.club-name{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,9.5vw,42px);letter-spacing:-.01em;line-height:1.15;background:linear-gradient(180deg,#FFE2BF,var(--flare) 45%,var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(255,107,26,.45))}
.enter{position:relative;padding:16px 46px;border-radius:999px;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--white);text-align:center;max-width:320px;line-height:1.35;
  background:linear-gradient(180deg,rgba(255,107,26,.32),rgba(120,40,5,.55));box-shadow:0 0 0 1px rgba(255,140,60,.5) inset,0 10px 40px -8px rgba(255,107,26,.7);
  animation:breathe 2.6s ease-in-out infinite;overflow:hidden}
.enter::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,230,200,.35) 50%,transparent 70%);background-size:250% 100%;animation:shine 3s linear infinite}
.enter:active{transform:scale(.97)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(255,140,60,.5) inset,0 10px 40px -8px rgba(255,107,26,.6)}50%{box-shadow:0 0 0 1px rgba(255,170,100,.8) inset,0 12px 60px -6px rgba(255,107,26,.95)}}

/* ---------- app ---------- */
#app{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:16px 18px 48px;opacity:0;transform:translateY(30px);pointer-events:none;transition:opacity .6s .35s,transform .8s .3s cubic-bezier(.2,.9,.25,1)}
body.entered #app{opacity:1;transform:none;pointer-events:auto}
body:not(.entered){overflow:hidden;height:100%}
.horizon,#embers{transition:opacity .8s}
body.entered .horizon{opacity:0}
body.entered #embers{opacity:.35}
.brand{display:flex;align-items:center;gap:10px;height:44px}
.brand .em{width:46px}
.brand .wm{height:17px;width:auto}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:16px 0 16px;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.seg button{position:relative;z-index:1;padding:11px 8px;font-size:14px;font-weight:600;color:var(--ash);transition:color .3s;border-radius:999px}
.seg button[aria-selected="true"]{color:#140700}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(180deg,var(--flare),var(--ember));box-shadow:0 6px 24px -6px rgba(255,107,26,.9);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
.seg[data-on="1"] .pill{transform:translateX(100%)}
.panel{display:none}
.panel.on{display:block;animation:panelIn .45s cubic-bezier(.2,.9,.25,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.lbl{font-size:13px;color:var(--ash);margin:0 0 9px}
.group{padding:16px 14px 2px;border-radius:20px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07)}
.group .block{margin:0;padding:0 0 16px}
.group .block+.block{padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px 11px 12px;border-radius:16px;background:var(--glass);border:1px solid rgba(255,255,255,.06);text-align:left;transition:border-color .25s,background .25s,transform .15s}
.plan:active{transform:scale(.97)}
.plan .pn{font-size:12.5px;color:var(--ash);font-weight:500;line-height:1.2}
.plan .pr{font-family:var(--display);font-weight:600;font-size:19px;margin-top:6px;letter-spacing:-.01em;white-space:nowrap}
.plan .pm{font-size:.78em;margin-right:2px;opacity:.8}
.plan .pd{font-size:11px;color:var(--dim)}
.plan .tag{position:absolute;bottom:12px;right:10px;font-size:10.5px;color:var(--ash)}
.plan .hot{position:absolute;top:-8px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:999px;color:#1a0800;background:linear-gradient(90deg,var(--flare),var(--ember));box-shadow:0 0 14px rgba(255,107,26,.8)}
.plan[aria-pressed="true"]{border-color:var(--ember);background:linear-gradient(180deg,rgba(255,107,26,.2),rgba(255,107,26,.05))}
.plan[aria-pressed="true"] .pn{color:var(--white)}
.plan[aria-pressed="true"] .pr{color:var(--flare)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ash);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);transition:.2s}
.chip[aria-pressed="true"]{color:#170800;background:var(--flare);border-color:var(--flare)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.frow .lbl{margin:0}
.cur{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.cur button{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--ash)}
.cur button[aria-pressed="true"]{background:rgba(255,107,26,.22);color:var(--white)}
.amt{display:flex;align-items:baseline;gap:8px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--stroke);transition:border-color .2s}
.amt:focus-within{border-color:var(--ember);box-shadow:0 0 0 4px rgba(255,107,26,.12)}
.amt .sym{font-family:var(--display);font-size:20px;color:var(--ember-hi)}
.amt input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--white);font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.01em;padding:0}
.rate{display:none;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--ash)}
body.rm .rate{display:flex}
.rate input{width:108px;padding:6px 9px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--white);font:600 16px var(--sans)}
.rate .live{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.rate .live.ok{background:#4ade80;box-shadow:0 0 8px #4ade80}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07)}
.pbox:focus-within{border-color:var(--ember)}
.pbox .lbl{font-size:11.5px;margin-bottom:6px;line-height:1.3;min-height:2.6em}
.pbox .in{display:flex;align-items:baseline;gap:4px}
.pbox .in span{color:var(--ember-hi);font-weight:600}
.pbox input{width:100%;min-width:0;background:none;border:0;outline:0;color:var(--white);font:600 18px var(--display);padding:0}
.mult{font-family:var(--display);font-size:11px;color:var(--flare);margin-left:auto}
.range{width:100%;margin:6px 0 0;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.range::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--ember) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:var(--flare);box-shadow:0 0 0 5px rgba(255,107,26,.25),0 0 18px rgba(255,107,26,.8)}
.range::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.range::-moz-range-progress{height:4px;border-radius:4px;background:var(--ember)}
.range::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--flare)}
.rv{font-family:var(--display);font-size:15px;color:var(--white);min-width:84px;text-align:center}
.pv{display:flex;flex-direction:column;align-items:flex-end}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--stroke);font-size:18px;line-height:1;color:var(--flare);display:grid;place-items:center}
.stepper button:active{background:rgba(255,107,26,.3)}
.rsub{font-size:12px;color:var(--flare);margin-top:5px;min-height:15px;padding-right:38px}

/* ---------- result card ---------- */
.hero{margin:22px 0 12px;padding:22px 18px 20px;text-align:center;border-radius:20px;background:linear-gradient(180deg,rgba(255,107,26,.17),rgba(255,107,26,.03));border:1px solid rgba(255,128,52,.38)}
.hero .rl{font-size:13px;color:var(--ash);margin-bottom:10px}
.big{font-family:var(--display);font-weight:700;line-height:1.1;color:var(--flare);white-space:nowrap;display:inline-flex;justify-content:center;letter-spacing:-.02em}
.reel{display:inline-block;height:1.1em;overflow:hidden;vertical-align:top}
.strip{display:block;will-change:transform}
.strip span,.sep{display:block;height:1.1em;line-height:1.1em;text-align:center}
.sep{display:inline-block}
.hero .rs{margin-top:16px;font-size:13px;color:var(--ash)}
.day-pill{display:inline-flex;align-items:baseline;gap:9px;padding:11px 22px;border-radius:999px;background:linear-gradient(180deg,rgba(255,107,26,.2),rgba(255,107,26,.08));border:1px solid rgba(255,128,52,.5);font-size:14px;color:var(--ash)}
.hero .day-pill b{font-family:var(--display);font-size:21px;font-weight:700;color:var(--white);letter-spacing:-.01em}
.hero .rs b{color:var(--white);font-weight:600}
.hero.pulse{animation:flash .8s ease-out}
@keyframes flash{0%{border-color:var(--flare);box-shadow:0 0 30px -6px rgba(255,107,26,.8)}100%{border-color:rgba(255,128,52,.38);box-shadow:none}}

/* break-even bar */
.be{padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:14px}
.be-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ash)}
.be-top b{font-family:var(--display);font-weight:600;font-size:14px;color:var(--white);text-align:right}
.bar{position:relative;height:12px;margin:14px 0 10px;border-radius:12px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .cap,.bar .pro{position:absolute;top:0;bottom:0;transition:width 1s cubic-bezier(.2,.9,.25,1),left 1s cubic-bezier(.2,.9,.25,1)}
.bar .cap{left:0;background:linear-gradient(90deg,rgba(255,107,26,.35),rgba(255,107,26,.55))}
.bar .pro{background:linear-gradient(90deg,var(--ember),var(--flare));box-shadow:0 0 16px rgba(255,140,60,.8)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ash);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .end{margin-left:auto}

.rows{border-radius:18px;border:1px solid rgba(255,255,255,.07);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:13px;color:var(--ash)}
.row:first-child{border-top:0}
.row b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--white);text-align:right;white-space:nowrap}
.row small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.row .x{font-size:11px;color:var(--flare);margin-left:6px;font-family:var(--display)}
.row.total{background:linear-gradient(90deg,rgba(255,107,26,.16),rgba(255,107,26,.04));color:var(--white)}
.row.total b{font-size:20px;color:var(--flare)}
.toggle{display:flex;align-items:center;gap:10px;margin:16px 2px 0;font-size:13px;color:var(--ash)}
.sw{position:relative;width:42px;height:24px;border-radius:24px;background:rgba(255,255,255,.1);transition:.25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--white);transition:.25s}
.sw[aria-checked="true"]{background:var(--ember)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}

.chart{padding:16px 14px 12px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-top:14px}
.chart .lbl{display:flex;justify-content:space-between}
.bars{display:flex;align-items:flex-end;gap:2px;height:130px;margin-top:6px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--flare),var(--ember) 40%,rgba(255,107,26,.35));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.25,1) both;min-height:2px}
@keyframes grow{from{transform:scaleY(0)}}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:6px}
.disc{margin:22px 4px 0;font-size:11px;line-height:1.55;color:var(--dim);text-align:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<canvas id="embers" aria-hidden="true"></canvas>
<div class="horizon" aria-hidden="true"></div>

<button id="langBtn" type="button" aria-label="Language"><span class="flag" id="langFlag">🇲🇾</span><span id="langCode">MS</span><svg viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>

<section id="splash">
  <div class="stage">

  [...str].forEach(c=>{if(!/\d/.test(c))return;const s=strips[i++],d=+c,pd=s._d??0;
    if(reduce){s.style.transform="translateY("+(-(20+d)/30*100)+"%)";s._d=d;return}
    s.style.transition="none";s.style.transform="translateY("+(-pd/30*100)+"%)";void s.offsetHeight;
    s.style.transition="transform "+(950+i*70)+"ms cubic-bezier(.12,.8,.18,1)";s.style.transform="translateY("+(-(20+d)/30*100)+"%)";s._d=d});
}
function pulse(id){const h=$(id);h.classList.remove("pulse");void h.offsetWidth;h.classList.add("pulse")}

/* ---------- build shared blocks ---------- */
function plansHTML(k){return ["flex","normal","long"].map(p=>{const P=PLANS[p];return "<button class='plan' data-plan='"+p+"' data-k='"+k+"'>"+(p==="long"?"<span class='hot'>HOT</span>":"")+
  (P.days?"<span class='tag'>"+P.days+"<span data-i18n='dshort'></span></span>":"")+"<span class='pn' data-i18n='"+p+"'></span><span class='pr'><span class='pm'>±</span>"+(P.r*100).toFixed(P.r<.01?2:0).replace(/0$/,"").replace(/\.$/,"")+"%</span><span class='pd' data-i18n='perDay'></span></button>"}).join("")}
function amountHTML(k){return "<div class='frow'><p class='lbl' data-i18n='amount'></p><div class='cur'><button data-cur='USDT'>USDT</button><button data-cur='LOC' class='loc-btn'></button></div></div>"+
  "<label class='amt'><span class='sym' data-sym></span><input id='"+k+"-amt' inputmode='decimal' autocomplete='off' data-k='"+k+"' data-field='amt' aria-label='amount'></label>"+
  "<div class='chips'>"+[1000,5000,10000,50000].map(v=>"<button class='chip' data-usd='"+v+"' data-amt='"+v+"' data-k='"+k+"'></button>").join("")+"</div>"+
  "<div class='rate'><span data-i18n='rate'></span><span>1 USDT = <span class='rate-sym'></span></span><input class='rate-in' inputmode='decimal' aria-label='rate'></div>"}
function pricesHTML(k){return "<div class='prices'><div class='pbox'><p class='lbl' data-i18n='priceNow'></p><div class='in'><span>$</span><input id='"+k+"-p0' inputmode='decimal' data-k='"+k+"' data-field='p0'></div></div>"+
  "<div class='pbox'><p class='lbl' data-i18n='priceEnd'></p><div class='in'><span>$</span><input id='"+k+"-p1' inputmode='decimal' data-k='"+k+"' data-field='p1'><span class='mult' id='"+k+"-mx'></span></div></div></div>"+
  "<div class='chips'>"+[1,2,3,5,10].map(m=>"<button class='chip' data-mult='"+m+"' data-k='"+k+"'>"+m+"x</button>").join("")+"</div>"}
document.querySelectorAll(".plans").forEach(el=>el.innerHTML=plansHTML(el.dataset.k));
document.querySelectorAll(".amount").forEach(el=>el.innerHTML=amountHTML(el.dataset.k));
document.querySelectorAll(".prices-wrap").forEach(el=>el.innerHTML=pricesHTML(el.dataset.k));
$("st-days").innerHTML=[30,90,180,360,540].map(d=>"<button class='chip' data-days='"+d+"'>"+d+" <span data-i18n='d'></span></button>").join("");
["en","ms","id","th","vi","zh","hk","hi","ja","ko"].forEach(l=>L[l].dshort=({en:"d",ms:"h",id:"h",th:" วัน",vi:" ngày",zh:"天",hk:"日",hi:" दिन",ja:"日",ko:"일"})[l]);

/* ---------- render ---------- */
function syncInputs(){
  ["st","cp"].forEach(k=>{const a=$(k+"-amt");if(document.activeElement!==a)a.value=fmtInput(S[k].amt);
    const p0=$(k+"-p0"),p1=$(k+"-p1");if(document.activeElement!==p0)p0.value=S[k].p0;if(document.activeElement!==p1)p1.value=S[k].p1;});
  document.querySelectorAll(".rate-in").forEach(r=>{if(document.activeElement!==r)r.value=fmtRate(R())});
  const C=CUR[lc()];document.querySelectorAll("[data-sym]").forEach(s=>s.textContent=S.cur==="LOC"?C.sym:"$");
  document.querySelectorAll(".loc-btn").forEach(b=>b.textContent=C.flag+" "+C.lbl);document.querySelectorAll(".rate-sym").forEach(s=>s.textContent=C.sym);
  document.querySelectorAll("[data-usd]").forEach(b=>{const v=S.cur==="LOC"?nice(+b.dataset.usd*R()):+b.dataset.usd;b.dataset.amt=v;b.textContent=nf0.format(v)});
  document.querySelectorAll("[data-cur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cur===S.cur));
  document.body.classList.toggle("rm",S.cur==="LOC");
  document.querySelectorAll("[data-plan]").forEach(b=>b.setAttribute("aria-pressed",S[b.dataset.k].plan===b.dataset.plan));
  document.querySelectorAll("[data-amt]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.amt===S[b.dataset.k].amt));
  document.querySelectorAll("[data-mult]").forEach(b=>{const s=S[b.dataset.k];b.setAttribute("aria-pressed",s.p0>0&&Math.abs(s.p1/s.p0-b.dataset.mult)<1e-6)});
  const fl=S.st.plan==="flex";$("st-days").style.display=fl?"flex":"none";
  document.querySelectorAll("[data-days]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.days===S.st.flexDays));
  document.querySelectorAll("[data-every]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.every===S.cp.every));
  $("st-fee").setAttribute("aria-checked",S.st.fee);
  syncRange();
}
function renderStake(){
  const s=S.st,P=PLANS[s.plan],days=P.days??s.flexDays,net=P.r*(s.fee?.95:1),amt=usd("st"),k=s.p0>0?s.p1/s.p0:1;
  const daily=amt*net,monthly=daily*30,rewards=daily*days,capEnd=amt*k,be=Math.ceil(1/net);
  reels($("st-monthly"),money(monthly));
  $("st-for").textContent="× "+(Math.round(days/30*10)/10)+" "+t("mo");
  tween($("st-daily"),daily,money);
  tween($("st-rewards"),rewards,money);tween($("st-capend"),capEnd,money);tween($("st-grand"),rewards+capEnd,money);
  tween($("st-roi"),rewards/(amt||1)*100,v=>nf0.format(v)+"%");tween($("st-units"),s.p0>0?amt/s.p0:0,v=>num(v)+" XEN");
  $("st-k").textContent=k!==1?(Math.round(k*100)/100)+"x":"";$("st-mx").textContent=k!==1?(Math.round(k*100)/100)+"x":"";
  const mos=(be/30).toFixed(1);$("st-be").textContent=be+" "+t("d")+" ≈ "+mos+" "+t("mo")+(be>days?" · "+t("beyond"):"");
  const cw=Math.min(1,be/days)*100;$("st-cap").style.width=cw+"%";$("st-pro").style.left=cw+"%";$("st-pro").style.width=(100-cw)+"%";
  $("st-end").textContent=t("contract")+" "+days+" "+t("d");
}
function renderComp(){
  const c=S.cp,r=PLANS[c.plan].r,amt=usd("cp"),k=c.p0>0?c.p1/c.p0:1,ser=[];
  const D=c.days;if(c.every==="month"){for(let m=1;m<=D/30;m++)ser.push(amt*Math.pow(1+30*r,m))}else{const N=Math.min(36,D);for(let i=1;i<=N;i++)ser.push(amt*Math.pow(1+r,Math.round(i*D/N)))}
  const fin=ser[ser.length-1]||amt,nw=fin*k,monthly=fin*r*30;
  reels($("cp-monthly"),money(monthly));tween($("cp-daily"),fin*r,money);
  tween($("cp-fin"),fin,money);tween($("cp-new"),nw,money);
  $("cp-mult").textContent="×"+(fin/(amt||1)>=100?nf0.format(fin/(amt||1)):(fin/(amt||1)).toFixed(1));
  $("cp-k").textContent=k!==1?(Math.round(k*100)/100)+"x":"";$("cp-mx").textContent=k!==1?(Math.round(k*100)/100)+"x":"";
  syncRange();
  const sig=ser.map(v=>v.toFixed(0)).join(",")+"|"+D;
  if($("cp-bars")._sig!==sig){$("cp-bars")._sig=sig;const mx=Math.max(...ser);$("cp-bars").innerHTML=ser.map((v,i)=>"<i style='height:"+Math.max(1.5,v/mx*100)+"%;animation-delay:"+(i*18)+"ms'></i>").join("")}
  $("cp-a0").textContent="0";$("cp-a1").textContent=dur(D);
}
function u(k,n){if(S.lang==="en"&&n===1)return k==="mo"?"month":"day";return t(k)}
function dur(d){const m=Math.floor(d/30),h=d%30,a=[];if(m)a.push(m+" "+u("mo",m));if(h||!m)a.push(h+" "+u("d",h));return a.join(" ")}
function syncRange(){const r=$("cp-range"),c=S.cp,mon=c.every==="month",mx=mon?36:1080,v=mon?c.days/30:c.days;
  r.max=mx;if(+r.value!==v)r.value=v;r.style.setProperty("--p",((v-1)/(mx-1)*100)+"%");
  $("cp-mv").textContent=mon?v+" "+u("mo",v):v+" "+u("d",v);
  $("cp-mv2").textContent=mon?"= "+c.days+" "+u("d",c.days):(c.days>=30?"= "+dur(c.days):"");
  $("cp-min").textContent="1 "+(mon?u("mo",1):u("d",1));$("cp-max").textContent=mx+" "+(mon?u("mo",mx):u("d",mx))}
function render(){syncInputs();renderStake();renderComp()}
let deb;function renderSoon(){clearTimeout(deb);deb=setTimeout(()=>{renderStake();renderComp();syncInputs()},280)}

function applyLang(){
  document.documentElement.lang=HTML_LANG[S.lang];
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  const l=LANGS.find(x=>x[0]===S.lang);$("langFlag").textContent=l[1];$("langCode").textContent=l[3];
  $("langGrid").innerHTML=LANGS.map(x=>"<button data-lang='"+x[0]+"' aria-pressed='"+(x[0]===S.lang)+"'><span class='flag'>"+x[1]+"</span>"+x[2]+"</button>").join("");
  renderStake();renderComp();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="enterBtn"){document.body.classList.add("entered");setTimeout(()=>{pulse("st-hero");$("st-monthly")._str=null;renderStake()},700);return}
  if(b.id==="langBtn"){$("sheet").classList.add("open");return}
  if(b.dataset.lang){const o=R();S.lang=b.dataset.lang;if(S.cur==="LOC"){const nr=R();["st","cp"].forEach(k=>S[k].amt=Math.round(S[k].amt/o*nr))}save();applyLang();syncInputs();setTimeout(()=>$("sheet").classList.remove("open"),160);return}
  if(b.dataset.tab){const on=b.dataset.tab;$("seg").dataset.on=on;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===on));
    $("p0").classList.toggle("on",on==="0");$("p1").classList.toggle("on",on==="1");const h=on==="0"?"st":"cp";$(h+"-monthly")._str=null;render();pulse(h+"-hero");return}
  if(b.dataset.plan){S[b.dataset.k].plan=b.dataset.plan;render();pulse(b.dataset.k+"-hero");return}
  if(b.dataset.cur){if(b.dataset.cur!==S.cur){const f=b.dataset.cur==="LOC"?R():1/R();["st","cp"].forEach(k=>S[k].amt=Math.round(S[k].amt*f));S.cur=b.dataset.cur;save();render()}return}
  if(b.dataset.amt){S[b.dataset.k].amt=+b.dataset.amt;render();return}
  if(b.dataset.mult){const s=S[b.dataset.k];s.p1=+(s.p0*b.dataset.mult).toFixed(6);render();return}
  if(b.dataset.days){S.st.flexDays=+b.dataset.days;render();return}
  if(b.dataset.step){const c=S.cp,st=c.every==="month"?30:1;c.days=Math.min(1080,Math.max(st,c.days+st*b.dataset.step));renderComp();return}
  if(b.dataset.every){S.cp.every=b.dataset.every;if(S.cp.every==="month")S.cp.days=Math.min(1080,Math.max(30,Math.round(S.cp.days/30)*30));render();return}
  if(b.id==="st-fee"){S.st.fee=!S.st.fee;render();return}
});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open")});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.field==="amt"){el.value=fmtInput(el.value);S[el.dataset.k].amt=parseNum(el.value);renderSoon();return}
  if(el.dataset.field==="p0"||el.dataset.field==="p1"){S[el.dataset.k][el.dataset.field]=parseNum(el.value);renderSoon();return}
  if(el.classList.contains("rate-in")){const v=parseNum(el.value);if(v>0){S.rates[lc()]=v;save();renderSoon()}return}
  if(el.id==="cp-range"){S.cp.days=S.cp.every==="month"?+el.value*30:+el.value;renderComp();return}
});
document.addEventListener("focusout",e=>{if(e.target.matches("input"))setTimeout(syncInputs,0)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input"))e.target.blur();if(e.key==="Escape")$("sheet").classList.remove("open")});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});


/* ---------- embers ---------- */
(()=>{const cv=$("embers"),cx=cv.getContext("2d");let W,H,P=[],run=true;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
  const mk=init=>({x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*1.5+.4,v:Math.random()*.32+.1,a:Math.random()*.55+.2,w:Math.random()*6.28,s:Math.random()*.012+.004});
  size();addEventListener("resize",size);for(let i=0;i<34;i++)P.push(mk(true));
  function draw(){if(!run)return;cx.clearRect(0,0,W,H);cx.globalCompositeOperation="lighter";
    for(const p of P){p.y-=p.v;p.w+=p.s;const x=p.x+Math.sin(p.w)*10,f=Math.min(1,p.y/H*1.6);cx.beginPath();cx.arc(x,p.y,p.r,0,6.283);cx.fillStyle="rgba(255,"+(120+p.r*30|0)+",50,"+(p.a*f)+")";cx.fill();
      if(p.y<-10)Object.assign(p,mk(false))}
    requestAnimationFrame(draw)}
  if(!reduce)draw();document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run&&!reduce)draw()});
})();

/* ---------- PWA ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname)){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

syncInputs();applyLang();
})();
